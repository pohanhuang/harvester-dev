apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rook-ceph-rbd-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-rbd
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: rook-ceph-rbd-test
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.36.1
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: rook-ceph-rbd-test
